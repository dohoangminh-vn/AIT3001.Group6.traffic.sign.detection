backend: yolo
weights: yolov8m.pt
imgsz: ${data.image_size}
batch_size: 16
epochs: 50
patience: 10
device: 0
amp: true
workers: 4
fraction: 1.0
# Optimizer and LR settings are omitted so Ultralytics 8.4.204 supplies defaults.
train_args:
  tile: false
  # Leave null to inherit the pinned Ultralytics defaults; override in YAML or CLI.
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: false
augmentation:
  hsv_h: 0.015
  hsv_s: 0.2
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
