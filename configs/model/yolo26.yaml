backend: yolo
weights: yolo26s.pt
imgsz: ${data.image_size}
batch_size: 4
epochs: 75
patience: 10
device: 0
amp: true
workers: 2
# Use 0.02 explicitly for a smoke test; full dataset is the default.
fraction: 1.0
# Ultralytics train arguments. Null values use the installed Ultralytics defaults.
train_args:
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: false

  augmentation:
    close_mosaic: 10
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0
    copy_paste: 0.0
    tile: false
