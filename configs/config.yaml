defaults:
  - model: yolov8
  - _self_

seed: 42
data:
  root: /kaggle/input
  prepared_dir: data/za_traffic_yolo_street
  image_size: 640
  val_fraction: 0.2
augmentation:
  enabled: false
evaluation:
  inference:
    score_threshold: 0.001
    nms_iou: 0.7
    max_detections: 300
  small_object_area_cutoffs_px2: [128, 256, 512, 1024]
output_dir: outputs
resume: null
prepare_only: false
tracking:
  name: null
  project: Traffic Sign
  entity: ducholmes-vietnam-national-university-hanoi
  mode: online
  checkpoint_every: 5
diagnostic:
  checkpoint: null
  conf: 0.25
  match_iou: 0.5
  batch_size: ${model.batch_size}
  amp: true
  tile: false
  device: ${model.device}
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
