defaults:
  - model: yolo26
  - _self_

seed: 42
data:
  root: /kaggle/input
  prepared_dir: data/za_traffic_yolo
  val_fraction: 0.2
output_dir: outputs
resume: null
prepare_only: false
tracking:
  project: Traffic Sign
  entity: ducholmes-vietnam-national-university-hanoi
  mode: online
  checkpoint_every: 5
diagnostic:
  checkpoint: null
  conf: 0.25
  match_iou: 0.5
  batch_size: ${model.batch_size}
  amp: true
  device: ${model.device}
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
